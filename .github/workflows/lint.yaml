name: Lint
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm" # This line enables caching for npm dependencies automatically
      - name: Install dependencies
        run: pnpm install
      - name: Run lint
        run: pnpm run lint
